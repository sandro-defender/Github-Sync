name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Safety net for the failure that broke 0.5.0: `config.yaml` pins `image:`, so
  # a version whose GHCR manifest is missing fails every install and update with
  # "[404] manifest unknown" instead of falling back to a local build.
  # release.yml refuses to advertise an unpublished version, and this job audits
  # the result — weekly and on demand it fails loudly, on a plain push to main it
  # only warns (the merge commit still carries the previous version while the
  # release job is publishing the new one).
  image-availability:
    name: Published image audit
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check the advertised version is installable
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          OWNER="${REPO_SLUG%%/*}" bash .github/scripts/check_published_images.sh

  app-linter:
    name: App configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Lint Home Assistant App
        uses: frenck/action-addon-linter@v2
        with:
          path: "./github_sync"

  tests:
    name: Python and frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: PYTHONPATH=github_sync/app python -m unittest discover -s tests -v
      # The panel is ESM (no build step), so check every shipped module. Plain
      # `node --check file.js` would parse them as CommonJS and fail.
      - name: Check frontend module syntax
        run: |
          set -euo pipefail
          find github_sync/app/static/app github_sync/app/static/lib -name '*.js' -print0 |
            while IFS= read -r -d '' file; do
              node --input-type=module --check - < "$file"
            done
          echo "All frontend modules parse."
      - run: node --test tests/test_frontend.cjs
