name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-linter:
    name: App configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Lint Home Assistant App
        uses: frenck/action-addon-linter@v2
        with:
          path: "./github_sync"
