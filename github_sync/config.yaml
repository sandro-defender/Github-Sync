name: GitHub Sync
version: "0.8.0"
slug: github_sync
description: Sync any Home Assistant folder with a GitHub repository. Each folder can target a different repo, with a sidebar UI, file browser, and smart gitignore editor.
url: https://github.com/sandro-defender/Github-Sync
# Pre-built multi-arch image (ghcr.io/sandro-defender/{arch}-github_sync behind a
# manifest). Published by .github/workflows/publish.yml; the tag always equals
# `version` above. Verify with .github/scripts/check_published_images.sh before
# changing this line.
image: "ghcr.io/sandro-defender/github_sync"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_stream: true
panel_icon: mdi:github
panel_title: GitHub Sync
homeassistant_api: true
homeassistant: 2024.12.0
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
  - type: share
    read_only: false
  - type: media
    read_only: false
  - type: backup
    read_only: false
  - type: addons
    read_only: false
  - type: all_addon_configs
    read_only: false
    path: /addon_configs
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|warning|error)
