name: Publish app image

# Builds the multi-arch app image and pushes it to the GitHub Container
# Registry, following the Home Assistant app publishing guide
# (https://developers.home-assistant.io/docs/apps/publishing).
#
# Pull requests run this workflow in build-only mode (no registry push) so a
# broken Dockerfile is caught before merge. On main it is dispatched by
# `.github/workflows/release.yml` once the version bump is committed, so the
# published image always matches `version:` in config.yaml.
#
# Until `image:` is set in github_sync/config.yaml, Supervisor builds the app
# locally on the user's machine. Once the first publish below succeeded, set:
#
#     image: "ghcr.io/sandro-defender/github_sync"
#
# Triggered by: pull requests (build only), `.github/workflows/release.yml`
# after the version bump (dispatch), a published release, or manually:
#
#     gh workflow run publish.yml --ref main
#
# Check with `.github/scripts/check_published_images.sh <version>` first.
#
# Per-arch images:  ghcr.io/sandro-defender/{arch}-github_sync
# Manifest image:   ghcr.io/sandro-defender/github_sync   (arch-independent)

on:
  # Pull requests build both architectures without pushing, so a broken
  # Dockerfile or builder input is caught before it reaches main.
  pull_request:
    paths:
      - "github_sync/**"
      - ".github/workflows/publish.yml"
  # A merge to main runs .github/workflows/release.yml, which bumps the version
  # and then dispatches this workflow. Pushes are not a trigger on purpose:
  # pushes made with GITHUB_TOKEN do not start workflows anyway, and building on
  # the pre-bump commit would publish an image with the previous version tag.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

# Never publish two images for the same ref at the same time; keep going on
# later pushes so a release build is not cancelled mid-flight.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: github_sync
  BUILDER_VERSION: "2026.09.0"
  # Pull requests only build (and never push) so a broken Dockerfile surfaces
  # before the change reaches main.
  PUBLISH: ${{ github.event_name != 'pull_request' }}
  # Owner is hard-coded on purpose: the image namespace must not change if the
  # repository is renamed or transferred.
  REGISTRY_PREFIX: ghcr.io/sandro-defender
  IMAGE_NAME: github_sync

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Read app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ env.APP_DIR }}"

      - name: Normalize image reference
        id: normalize
        env:
          INFO_IMAGE: ${{ steps.info.outputs.image }}
          INFO_URL: ${{ steps.info.outputs.url }}
        run: |
          set -euo pipefail
          # Prefer the image from config.yaml; fall back to the registry
          # convention so the pipeline works before `image:` is enabled.
          image="${INFO_IMAGE}"
          if [[ -z "${image}" || "${image}" == "null" ]]; then
            image="${REGISTRY_PREFIX}/${IMAGE_NAME}"
          fi
          echo "image_name=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${image%/*}" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.info.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "name=${{ steps.info.outputs.name }}" >> "$GITHUB_OUTPUT"
          echo "description=${{ steps.info.outputs.description }}" >> "$GITHUB_OUTPUT"
          if [[ -n "${INFO_URL}" && "${INFO_URL}" != "null" ]]; then
            echo "url=${INFO_URL}" >> "$GITHUB_OUTPUT"
          fi
          echo "Publishing ${image}:${{ steps.info.outputs.version }}"

      - name: Prepare multi-arch matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build image (pushed on main, releases and manual runs)
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ env.APP_DIR }}"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: ${{ env.PUBLISH }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
