name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-linter:
    name: App configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Lint Home Assistant App
        uses: frenck/action-addon-linter@v2
        with:
          path: "./github_sync"

  tests:
    name: Python and frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: PYTHONPATH=github_sync/app python -m unittest discover -s tests -v
      - run: node --check github_sync/app/static/app.js
      - run: node --test tests/test_frontend.cjs
